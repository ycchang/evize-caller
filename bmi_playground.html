<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Playground</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #111827;
    }
    .card {
      width: min(92vw, 430px);
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    .sub {
      color: #6b7280;
      margin: 0 0 24px;
    }
    label {
      display: block;
      font-weight: 650;
      margin: 16px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #f3f4f6;
      text-align: center;
      min-height: 86px;
      display: grid;
      place-items: center;
    }
    .bmi {
      font-size: 2.2rem;
      font-weight: 800;
    }
    .category {
      color: #4b5563;
      margin-top: 4px;
      font-weight: 600;
    }
    .hint {
      margin-top: 16px;
      font-size: .88rem;
      color: #6b7280;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>BMI Playground</h1>
    <p class="sub">Enter your height and weight to calculate your BMI.</p>

    <label for="height">Height (cm)</label>
    <input id="height" type="number" min="50" max="250" step="0.1" placeholder="e.g. 170" />

    <label for="weight">Weight (kg)</label>
    <input id="weight" type="number" min="10" max="400" step="0.1" placeholder="e.g. 65" />

    <button id="calcBtn">Calculate BMI</button>

    <section class="result" id="result">
      <div>Enter your measurements above.</div>
    </section>

    <p class="hint">
      BMI = weight (kg) ÷ height² (m). BMI is only a rough screening measure and does not account for factors such as muscle mass or body composition.
    </p>
  </main>

  <script>
    function calculateBMI() {
      const heightCm = parseFloat(document.getElementById("height").value);
      const weightKg = parseFloat(document.getElementById("weight").value);
      const result = document.getElementById("result");

      if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) {
        result.innerHTML = "<div>Please enter a valid height and weight.</div>";
        return;
      }

      const heightM = heightCm / 100;
      const bmi = weightKg / (heightM * heightM);

      let category = "";
      if (bmi < 18.5) category = "Underweight";
      else if (bmi < 25) category = "Normal range";
      else if (bmi < 30) category = "Overweight";
      else category = "Obesity range";

      result.innerHTML = `
        <div>
          <div class="bmi">${bmi.toFixed(1)}</div>
          <div class="category">${category}</div>
        </div>
      `;
    }

    document.getElementById("calcBtn").addEventListener("click", calculateBMI);

    ["height", "weight"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") calculateBMI();
      });
    });
  </script>
</body>
</html>
